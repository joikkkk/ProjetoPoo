<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca POO - Spring Boot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; border-bottom: 2px solid #0056b3; padding-bottom: 5px; }
        .mensagem-erro { color: #721c24; font-weight: bold; background: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 10px;}
        .mensagem-sucesso { color: #155724; font-weight: bold; background: #d4edda; padding: 10px; border-radius: 5px; margin-bottom: 10px;}
        .secao { display: flex; gap: 20px; margin-bottom: 30px; }
        .formulario, .lista { flex: 1; padding: 15px; background: #fafafa; border: 1px solid #ddd; border-radius: 5px; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px;}
        button:hover { background-color: #003d82; }
        .btn-remover { background-color: #dc3545; margin-top: 15px;}
        .btn-remover:hover { background-color: #c82333; }
        ul { padding-left: 20px; }
        li { margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Sistema de Biblioteca </h1>

    <!-- Avisos de Erro ou Sucesso -->
    <div th:if="${erro}" class="mensagem-erro" th:text="${erro}"></div>
    <div th:if="${sucesso}" class="mensagem-sucesso" th:text="${sucesso}"></div>

    <!-- SEÇÃO 1: ACERVO -->
    <div class="secao">
        <div class="formulario">
            <h2>Cadastrar Item</h2>
            <form action="/cadastrar-item" method="post">
                <input type="text" name="id" placeholder="ID (ex: L2)" required>
                <input type="text" name="titulo" placeholder="Título do Item" required>
                <select name="tipo">
                    <option value="Livro">Livro</option>
                    <option value="Revista">Revista</option>
                    <option value="DVD">DVD</option>
                </select>
                <button type="submit">Cadastrar Item</button>
            </form>

            <h2 style="margin-top: 20px; font-size: 1.1em; color: #dc3545;">Remover Item</h2>
            <form action="/remover-item" method="post">
                <input type="text" name="idItem" placeholder="ID do Item para remover" required>
                <button type="submit" class="btn-remover">Remover Item</button>
            </form>
        </div>
        <div class="lista">
            <h2>Itens no Acervo</h2>
            <ul>
                <li th:each="item : ${acervo}" th:text="${item.obterDetalhes()}"></li>
            </ul>
        </div>
    </div>

    <!-- SEÇÃO 2: USUÁRIOS -->
    <div class="secao">
        <div class="formulario">
            <h2>Cadastrar Usuário</h2>
            <form action="/cadastrar-usuario" method="post">
                <input type="text" name="matricula" placeholder="Matrícula" required>
                <input type="text" name="nome" placeholder="Nome Completo" required>
                <select name="tipo">
                    <option value="Aluno">Aluno</option>
                    <option value="Professor">Professor</option>
                </select>
                <button type="submit">Cadastrar Usuário</button>
            </form>

            <h2 style="margin-top: 20px; font-size: 1.1em; color: #dc3545;">Remover Usuário</h2>
            <form action="/remover-usuario" method="post">
                <input type="text" name="matricula" placeholder="Matrícula para remover" required>
                <button type="submit" class="btn-remover">Remover Usuário</button>
            </form>
        </div>
        <div class="lista">
            <h2>Usuários Cadastrados</h2>
            <ul>
                <li th:each="user : ${usuarios}" th:text="${user.obterDetalhes()}"></li>
            </ul>
        </div>
    </div>

    <!-- SEÇÃO 3: EMPRÉSTIMO E DEVOLUÇÃO -->
    <div class="secao">
        <div class="formulario">
            <h2>Realizar Empréstimo</h2>
            <form action="/emprestar" method="post">
                <input type="text" name="matricula" placeholder="Matrícula do Usuário" required>
                <input type="text" name="idItem" placeholder="ID do Item" required>
                <button type="submit">Emprestar</button>
            </form>

            <h2 style="margin-top: 20px;">Devolver Item</h2>
            <form action="/devolver" method="post">
                <input type="text" name="idItem" placeholder="ID do Item" required>
                <input type="number" name="diasAtraso" placeholder="Dias de Atraso (0 se no prazo)" value="0" required>
                <button type="submit" class="btn-remover" style="background-color: #28a745;">Devolver / Calcular Multa</button>
            </form>
        </div>
        <div class="lista">
            <h2>Empréstimos Ativos</h2>
            <ul>
                <li th:each="emp : ${emprestimos}" th:text="${emp.obterDetalhes()}"></li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
